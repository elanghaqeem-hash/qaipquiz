name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext for Cloudflare
        run: npm run build:cloudflare

      - name: Validate Wrangler deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
